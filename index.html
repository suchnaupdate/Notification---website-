<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information & Notification</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
    }

    header {
      background: #1769aa;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .notification {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #1769aa;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .notification h3 {
      color: #1769aa;
      margin-top: 0;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    #adminPanel {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
    }

    #addForm {
      display: none;
      margin-top: 20px;
    }

    #message {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Information & Notification</h1>
  <p>महत्वपूर्ण सूचना और जानकारी</p>
</header>

<div class="container">

  <h2>Latest Notifications</h2>

  <div id="notifications">
    सूचनाएँ लोड हो रही हैं...
  </div>

  <div id="adminPanel">

    <h2>Admin</h2>

    <button id="loginButton" onclick="login()">
      Admin Login
    </button>

    <button id="logoutButton" onclick="logout()" style="display:none;">
      Logout
    </button>

    <div id="addForm">

      <h3>नई सूचना जोड़ें</h3>

      <input
        id="title"
        type="text"
        placeholder="Title"
      >

      <textarea
        id="description"
        placeholder="Description"
      ></textarea>

      <input
        id="category"
        type="text"
        placeholder="Category"
      >

      <input
        id="image_url"
        type="text"
        placeholder="Image URL"
      >

      <textarea
        id="content"
        placeholder="Content"
      ></textarea>

      <button onclick="addNotification()">
        सूचना जोड़ें
      </button>

      <p id="message"></p>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://hduvjoammklsahiornxy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YJceciJHp6oMFjqTeAW9yQ_cSPRqyKB";


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications() {

  const box =
    document.getElementById("notifications");

  box.innerHTML =
    "<p>सूचनाएँ लोड हो रही हैं...</p>";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/notifications?select=*",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    const responseText =
      await response.text();

    console.log(
      "Supabase response:",
      responseText
    );

    if (!response.ok) {
      throw new Error(
        "Supabase Error: " +
        responseText
      );
    }

    const data =
      JSON.parse(responseText);

    if (!Array.isArray(data)) {
      throw new Error(
        "Invalid notification data"
      );
    }

    if (data.length === 0) {

      box.innerHTML =
        "<p>अभी कोई सूचना उपलब्ध नहीं है।</p>";

      return;
    }

    /* Latest notification first */

    data.sort(function(a, b) {

      return (
        new Date(b.published_at || 0) -
        new Date(a.published_at || 0)
      );

    });

    box.innerHTML = "";

    data.forEach(function(item) {

      const div =
        document.createElement("div");

      div.className =
        "notification";

      div.innerHTML = `

        <h3>
          ${item.title || ""}
        </h3>

        <p>
          ${item.description || ""}
        </p>

        <small>
          ${item.category || ""}
        </small>

        ${
          item.image_url
          ?
          `
          <br>
          <img
            src="${item.image_url}"
            alt="Notification Image"
            style="
              max-width:100%;
              margin-top:10px;
              border-radius:6px;
            "
          >
          `
          :
          ""
        }

        ${
          item.content
          ?
          `
          <p>
            ${item.content}
          </p>
          `
          :
          ""
        }

      `;

      box.appendChild(div);


      /* Delete button for admin */

      if (
        localStorage.getItem("access_token")
      ) {

        const deleteButton =
          document.createElement("button");

        deleteButton.innerText =
          "Delete";

        deleteButton.style.background =
          "#d32f2f";

        deleteButton.style.marginTop =
          "10px";

        deleteButton.onclick =
          function() {

            deleteNotification(
              item.Id
            );

          };

        div.appendChild(
          deleteButton
        );
      }

    });

  } catch (error) {

    console.error(
      "Notification loading error:",
      error
    );

    box.innerHTML = `
      <p>
        सूचनाएँ लोड नहीं हो सकीं।
      </p>
      <small>
        कृपया थोड़ी देर बाद फिर प्रयास करें।
      </small>
    `;
  }
}


/* =========================
   ADMIN LOGIN
========================= */

function login() {

  const email =
    prompt("Admin email डालें:");

  if (!email) {
    return;
  }

  const password =
    prompt("Password डालें:");

  if (!password) {
    return;
  }

  authenticate(
    email,
    password
  );
}


/* =========================
   AUTHENTICATE
========================= */

async function authenticate(
  email,
  password
) {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        "Login नहीं हुआ: " +
        (
          data.error_description ||
          data.msg ||
          "Invalid login"
        )
      );

      return;
    }

    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "refresh_token",
      data.refresh_token
    );

    document.getElementById(
      "loginButton"
    ).style.display = "none";

    document.getElementById(
      "logoutButton"
    ).style.display = "inline-block";

    document.getElementById(
      "addForm"
    ).style.display = "block";

    alert(
      "Admin login सफल हुआ।"
    );

    loadNotifications();

  } catch (error) {

    console.error(
      "Login error:",
      error
    );

    alert(
      "Login में समस्या हुई।"
    );
  }
}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  document.getElementById(
    "loginButton"
  ).style.display = "inline-block";

  document.getElementById(
    "logoutButton"
  ).style.display = "none";

  document.getElementById(
    "addForm"
  ).style.display = "none";

  loadNotifications();
}


/* =========================
   ADD NOTIFICATION
========================= */

async function addNotification() {

  const token =
    localStorage.getItem(
      "access_token"
    );

  if (!token) {

    alert(
      "पहले Admin Login करें।"
    );

    return;
  }

  const title =
    document.getElementById(
      "title"
    ).value.trim();

  const description =
    document.getElementById(
      "description"
    ).value.trim();

  const category =
    document.getElementById(
      "category"
    ).value.trim();

  const image_url =
    document.getElementById(
      "image_url"
    ).value.trim();

  const content =
    document.getElementById(
      "content"
    ).value.trim();


  if (!title) {

    alert(
      "कृपया Title डालें।"
    );

    return;
  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/notifications",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            title: title,

            description:
              description,

            category:
              category,

            image_url:
              image_url || null,

            content:
              content,

            published_at:
              new Date().toISOString()

          })
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(
        "Add notification error:",
        error
      );

      alert(
        "सूचना जोड़ने में समस्या हुई:\n" +
        error
      );

      return;
    }


    document.getElementById(
      "message"
    ).innerText =
      "सूचना सफलतापूर्वक जोड़ दी गई।";


    document.getElementById(
      "title"
    ).value = "";

    document.getElementById(
      "description"
    ).value = "";

    document.getElementById(
      "category"
    ).value = "";

    document.getElementById(
      "image_url"
    ).value = "";

    document.getElementById(
      "content"
    ).value = "";


    await loadNotifications();

  } catch (error) {

    console.error(
      "Add notification error:",
      error
    );

    alert(
      "सूचना जोड़ने में समस्या हुई।"
    );
  }
}


/* =========================
   DELETE NOTIFICATION
========================= */

async function deleteNotification(Id) {

  const token =
    localStorage.getItem(
      "access_token"
    );


  if (!token) {

    alert(
      "पहले Admin Login करें।"
    );

    return;
  }


  if (
    !confirm(
      "क्या आप यह सूचना delete करना चाहते हैं?"
    )
  ) {

    return;
  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/notifications?Id=eq." +
        encodeURIComponent(Id),
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token
          }
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(
        "Delete error:",
        error
      );

      alert(
        "Delete नहीं हुआ:\n" +
        error
      );

      return;
    }


    alert(
      "सूचना delete हो गई।"
    );


    loadNotifications();

  } catch (error) {

    console.error(
      "Delete error:",
      error
    );

    alert(
      "Delete करने में समस्या हुई।"
    );
  }
}


/* =========================
   PAGE START
========================= */

loadNotifications();

</script>

</body>
</html>
