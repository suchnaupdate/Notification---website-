<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information & Notification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
    }

    header {
      background: #1769aa;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .notification {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #1769aa;
    }

    .notification h3 {
      color: #1769aa;
    }
  </style>
</head>

<body>

<header>
  <h1>Information & Notification</h1>
  <p>महत्वपूर्ण सूचना और जानकारी</p>
</header>

<div class="container">
  <h2>Latest Notifications</h2>
  <div id="notifications">सूचनाएँ लोड हो रही हैं...</div>
</div>

<script>
const SUPABASE_URL = "https://hduvjoammklsahiornxy.supabase.co";
const SUPABASE_KEY = "sb_publishable_YJceciJHp6oMFjqTeAW9yQ_cSPRqyKB";

async function loadNotifications() {
  const box = document.getElementById("notifications");

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/notifications?select=title,description,category,image_url",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Supabase error");
    }

    const data = await response.json();

    if (data.length === 0) {
      box.innerHTML = "<p>अभी कोई सूचना उपलब्ध नहीं है।</p>";
      return;
    }

    box.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "notification";

      div.innerHTML = `
        <h3>${item.title || ""}</h3>
        <p>${item.description || ""}</p>
        <small>${item.category || ""}</small>
      `;

      box.appendChild(div);
    });

  } catch (error) {
    console.error(error);
    box.innerHTML = "<p>सूचनाएँ लोड नहीं हो सकीं।</p>";
  }
}

loadNotifications();
</script>

</body>
</html>
