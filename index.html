<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suchna Update</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #1769aa, #0d47a1);
      color: white;
      text-align: center;
      padding: 32px 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .section-title {
      color: #1769aa;
      margin-bottom: 15px;
    }

    /* SEARCH BOX */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #1769aa;
    }

    #searchMessage {
      color: #777;
      margin: 10px 0 0;
      font-size: 14px;
    }

    .notification {
      background: white;
      margin: 18px 0;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #1769aa;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .notification h3 {
      color: #1769aa;
      margin: 0 0 10px;
      font-size: 21px;
    }

    .notification p {
      line-height: 1.6;
      margin: 8px 0;
    }

    .category {
      display: inline-block;
      background: #e3f2fd;
      color: #1769aa;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }

    .notification img {
      max-width: 100%;
      margin-top: 12px;
      border-radius: 8px;
      display: block;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      padding: 11px 17px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    .delete-button {
      background: #d32f2f;
      margin-top: 12px;
    }

    #adminArea {
      margin-top: 35px;
      text-align: center;
    }

    #adminLoginBox {
      display: inline-block;
    }

    #adminPanel {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: left;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    #adminPanel h2 {
      color: #1769aa;
      margin-top: 0;
    }

    #addForm {
      margin-top: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    #message {
      font-weight: bold;
    }

    .loading {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .admin-login-button {
      background: #1769aa;
    }

    .logout-button {
      background: #555;
      margin-left: 8px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 26px;
      }

      .container {
        padding: 10px;
        margin-top: 15px;
      }

      .notification {
        padding: 16px;
      }

      .notification h3 {
        font-size: 19px;
      }

      #adminPanel {
        padding: 17px;
      }

      .logout-button {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Suchna Update</h1>
  <p>महत्वपूर्ण सूचना और जानकारी</p>
</header>


<div class="container">

  <h2 class="section-title">
    Latest Notifications
  </h2>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="🔎 सूचना खोजें..."
      oninput="searchNotifications()"
    >

    <p id="searchMessage"></p>

  </div>


  <div id="notifications">

    <div class="loading">
      सूचनाएँ लोड हो रही हैं...
    </div>

  </div>


  <!-- ADMIN AREA -->

  <div id="adminArea">

    <div id="adminLoginBox">

      <button
        class="admin-login-button"
        id="loginButton"
        onclick="login()">

        🔐 Admin Login

      </button>

    </div>


    <div id="adminPanel">

      <h2>Admin Panel</h2>

      <button
        class="logout-button"
        onclick="logout()">

        Logout

      </button>


      <div id="addForm">

        <h3>नई सूचना जोड़ें</h3>

        <input
          id="title"
          type="text"
          placeholder="Title"
        >

        <textarea
          id="description"
          placeholder="Description"
        ></textarea>

        <input
          id="category"
          type="text"
          placeholder="Category"
        >

        <input
          id="image_url"
          type="text"
          placeholder="Image URL (optional)"
        >

        <textarea
          id="content"
          placeholder="Content"
        ></textarea>

        <button onclick="addNotification()">

          सूचना जोड़ें

        </button>

        <p id="message"></p>

      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hduvjoammklsahiornxy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YJceciJHp6oMFjqTeAW9yQ_cSPRqyKB";


/* =========================
   STORE NOTIFICATIONS
========================= */

let allNotifications = [];


/* =========================
   ADMIN UI
========================= */

function updateAdminUI() {

  const token =
    localStorage.getItem("access_token");

  const loginBox =
    document.getElementById("adminLoginBox");

  const adminPanel =
    document.getElementById("adminPanel");


  if (token) {

    loginBox.style.display = "none";

    adminPanel.style.display = "block";

  } else {

    loginBox.style.display = "block";

    adminPanel.style.display = "none";

  }

}


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications() {

  const box =
    document.getElementById("notifications");

  box.innerHTML =
    '<div class="loading">सूचनाएँ लोड हो रही हैं...</div>';


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/notifications?select=*",

      {

        method: "GET",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        }

      }

    );


    const responseText =
      await response.text();


    if (!response.ok) {

      throw new Error(responseText);

    }


    const data =
      JSON.parse(responseText);


    if (!Array.isArray(data)) {

      throw new Error("Invalid data");

    }


    allNotifications = data;


    allNotifications.sort(function(a, b) {

      return (

        new Date(b.published_at || 0) -

        new Date(a.published_at || 0)

      );

    });


    displayNotifications(
      allNotifications
    );


  } catch (error) {

    console.error(
      "Notification loading error:",
      error
    );


    box.innerHTML =
      "<p>सूचनाएँ लोड नहीं हो सकीं।</p>";

  }

}


/* =========================
   DISPLAY NOTIFICATIONS
========================= */

function displayNotifications(data) {

  const box =
    document.getElementById(
      "notifications"
    );


  const searchMessage =
    document.getElementById(
      "searchMessage"
    );


  box.innerHTML = "";


  if (data.length === 0) {

    box.innerHTML =
      "<p>कोई सूचना नहीं मिली।</p>";

    searchMessage.innerText =
      "इस शब्द से कोई सूचना नहीं मिली।";

    return;

  }


  searchMessage.innerText =
    "";


  data.forEach(function(item) {

    const div =
      document.createElement("div");

    div.className =
      "notification";


    /* TITLE */

    const title =
      document.createElement("h3");

    title.textContent =
      item.title || "";

    div.appendChild(title);


    /* DESCRIPTION */

    if (item.description) {

      const description =
        document.createElement("p");

      description.textContent =
        item.description;

      div.appendChild(description);

    }


    /* CATEGORY */

    if (item.category) {

      const category =
        document.createElement("span");

      category.className =
        "category";

      category.textContent =
        item.category;

      div.appendChild(category);

    }


    /* IMAGE */

    if (item.image_url) {

      const image =
        document.createElement("img");

      image.src =
        item.image_url;

      image.alt =
        "Notification Image";

      div.appendChild(image);

    }


    /* CONTENT */

    if (item.content) {

      const content =
        document.createElement("p");

      content.textContent =
        item.content;

      div.appendChild(content);

    }


    /* DATE */

    if (item.published_at) {

      const date =
        document.createElement("div");

      date.className =
        "date";

      const d =
        new Date(item.published_at);

      date.textContent =
        "📅 " +
        d.toLocaleString("hi-IN");

      div.appendChild(date);

    }


    /* DELETE */

    if (
      localStorage.getItem(
        "access_token"
      )
    ) {

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        function() {

          deleteNotification(
            item.Id
          );

        };


      div.appendChild(
        deleteButton
      );

    }


    box.appendChild(div);

  });

}


/* =========================
   SEARCH
========================= */

function searchNotifications() {

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const searchText =
    searchInput.value
      .trim()
      .toLowerCase();


  if (!searchText) {

    displayNotifications(
      allNotifications
    );

    return;

  }


  const filtered =
    allNotifications.filter(
      function(item) {

        const title =
          String(
            item.title || ""
          ).toLowerCase();

        const description =
          String(
            item.description || ""
          ).toLowerCase();

        const category =
          String(
            item.category || ""
          ).toLowerCase();

        const content =
          String(
            item.content || ""
          ).toLowerCase();


        return (

          title.includes(searchText) ||

          description.includes(searchText) ||

          category.includes(searchText) ||

          content.includes(searchText)

        );

      }
    );


  displayNotifications(
    filtered
  );

}


/* =========================
   LOGIN
========================= */

function login() {

  const email =
    prompt(
      "Admin email डालें:"
    );


  if (!email) {

    return;

  }


  const password =
    prompt(
      "Password डालें:"
    );


  if (!password) {

    return;

  }


  authenticate(
    email,
    password
  );

}


/* =========================
   AUTHENTICATE
========================= */

async function authenticate(
  email,
  password
) {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            email:
              email,

            password:
              password

          })

        }

      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(

        "Login नहीं हुआ: " +

        (

          data.error_description ||

          data.msg ||

          "Invalid login"

        )

      );

      return;

    }


    localStorage.setItem(

      "access_token",

      data.access_token

    );


    localStorage.setItem(

      "refresh_token",

      data.refresh_token

    );


    updateAdminUI();


    alert(
      "Admin login सफल हुआ।"
    );


    displayNotifications(
      allNotifications
    );

  } catch (error) {

    console.error(
      "Login error:",
      error
    );


    alert(
      "Login में समस्या हुई।"
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "access_token"
  );


  localStorage.removeItem(
    "refresh_token"
  );


  updateAdminUI();


  displayNotifications(
    allNotifications
  );

}


/* =========================
   ADD NOTIFICATION
========================= */

async function addNotification() {

  const token =
    localStorage.getItem(
      "access_token"
    );


  if (!token) {

    alert(
      "पहले Admin Login करें।"
    );

    return;

  }


  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value.trim();


  const image_url =
    document.getElementById(
      "image_url"
    ).value.trim();


  const content =
    document.getElementById(
      "content"
    ).value.trim();


  if (!title) {

    alert(
      "कृपया Title डालें।"
    );

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/notifications",

        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            title:
              title,

            description:
              description,

            category:
              category,

            image_url:
              image_url || null,

            content:
              content,

            published_at:
              new Date().toISOString()

          })

        }

      );


    if (!response.ok) {

      const error =
        await response.text();


      alert(

        "सूचना जोड़ने में समस्या हुई:\n" +

        error

      );


      return;

    }


    document.getElementById(
      "message"
    ).innerText =
      "सूचना सफलतापूर्वक जोड़ दी गई।";


    document.getElementById(
      "title"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "";


    document.getElementById(
      "image_url"
    ).value = "";


    document.getElementById(
      "content"
    ).value = "";


    await loadNotifications();


  } catch (error) {

    console.error(
      "Add notification error:",
      error
    );


    alert(
      "सूचना जोड़ने में समस्या हुई।"
    );

  }

}


/* =========================
   DELETE NOTIFICATION
========================= */

async function deleteNotification(Id) {

  const token =
    localStorage.getItem(
      "access_token"
    );


  if (!token) {

    alert(
      "पहले Admin Login करें।"
    );

    return;

  }


  if (
    !confirm(
      "क्या आप यह सूचना delete करना चाहते हैं?"
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/notifications?Id=eq." +

        encodeURIComponent(Id),

        {

          method: "DELETE",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      const error =
        await response.text();


      alert(

        "Delete नहीं हुआ:\n" +

        error

      );


      return;

    }


    alert(
      "सूचना delete हो गई।"
    );


    await loadNotifications();


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Delete करने में समस्या हुई।"
    );

  }

}


/* =========================
   START WEBSITE
========================= */

updateAdminUI();

loadNotifications();

</script>

</body>
</html>
